<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Woolgather — logic tests</title>
<style>
  body{ font-family: ui-monospace, Menlo, Consolas, monospace; max-width:760px; margin:24px auto; padding:0 16px; color:#2A2333; }
  h1{ font-family: Georgia, serif; }
  .pass{ color:#3E6B49; }
  .fail{ color:#7A2F4B; font-weight:700; }
  .row{ padding:3px 0; border-bottom:1px solid #eee; }
  #summary{ font-size:1.1rem; font-weight:700; margin:16px 0; padding:12px; border-radius:8px; }
  #summary.ok{ background:#e3efe3; color:#3E6B49; }
  #summary.bad{ background:#f6e2e8; color:#7A2F4B; }
</style>
</head>
<body>
<h1>Woolgather logic tests</h1>
<p>Runs the app's pure functions (color science, gauge, units, scrap, weight) against known values. No framework — just open this file. It stubs browser globals so app.js can load without booting the UI.</p>
<div id="summary">Running…</div>
<div id="results"></div>

<!-- Stub the browser globals app.js touches at load, BEFORE loading it, so
     importing the file defines its functions without starting the real app. -->
<script>
  window.STATE = { unitPref:'yd', yarns:[], projects:[] };
  window.FB = null;                       // app guards on this; no auto-init
  // no-op DOM bits app.js may call at module top-level
  window.matchMedia = window.matchMedia || function(){ return { matches:false, addEventListener(){}, addListener(){} }; };
</script>
<script src="app.js"></script>

<script>
(function(){
  const results = document.getElementById('results');
  let passed = 0, failed = 0;

  function ok(name, cond){
    const div = document.createElement('div');
    div.className = 'row ' + (cond ? 'pass' : 'fail');
    div.textContent = (cond ? '✓ ' : '✗ FAIL — ') + name;
    results.appendChild(div);
    cond ? passed++ : failed++;
  }
  // approximate-equality for floats
  const near = (a,b,tol=0.5)=>Math.abs(a-b)<=tol;

  // --- Color science ---
  try{
    ok('deltaE2000 identical = 0', deltaE2000(hexToLab('#5C3A72'), hexToLab('#5C3A72')) === 0);
    ok('deltaE2000 black vs white ≈ 100', near(deltaE2000(hexToLab('#000'), hexToLab('#fff')), 100, 1));
    // Sharma et al. CIEDE2000 reference pair ≈ 2.0425
    ok('CIEDE2000 Sharma reference ≈ 2.04', near(deltaE2000({L:50,a:2.6772,b:-79.7751},{L:50,a:0,b:-82.7485}), 2.0425, 0.02));
    ok('nameColor sage', nameColor('#8FAF7C') === 'Sage green');
    ok('nameColor plum', nameColor('#5C3A72') === 'Plum');
    ok('nameColor navy', nameColor('#2a3a63') === 'Navy');
    ok('hslToHex red', hslToHex(0,100,50).toLowerCase() === '#ff0000');
  }catch(e){ ok('color science block threw: '+e.message, false); }

  // --- Neutrals ---
  try{
    ok('neutral: grey', isNeutralYarn({colorHex:'#9098a1'}) === true);
    ok('neutral: cream', isNeutralYarn({colorHex:'#efe7d3'}) === true);
    ok('neutral: brown', isNeutralYarn({colorHex:'#6f4e37'}) === true);
    ok('NOT neutral: sage', isNeutralYarn({colorHex:'#8faf7c'}) === false);
    ok('NOT neutral: moss (muted green)', isNeutralYarn({colorHex:'#6f7d5a'}) === false);
    ok('NOT neutral: rust', isNeutralYarn({colorHex:'#a8432a'}) === false);
  }catch(e){ ok('neutrals block threw: '+e.message, false); }

  // --- Weight adjacency (Aran merged into Worsted) ---
  try{
    ok('weight DK<->Worsted adjacent', weightCompatible('DK','Worsted') === true);
    ok('weight DK<->Bulky NOT adjacent', weightCompatible('DK','Bulky') === false);
    ok('weight Worsted<->Bulky adjacent', weightCompatible('Worsted','Bulky') === true);
  }catch(e){ ok('weight block threw: '+e.message, false); }

  // --- Units (yd canonical). STATE is module-scoped inside app.js and not
  //     reachable here, so we test the conversion CONSTANT/math directly
  //     rather than flipping the preference through the STATE wrappers. ---
  try{
    const YDPM = 1.0936133;
    ok('220 yd ≈ 201 m', near(Math.round(220/YDPM), 201, 1));
    ok('201 m ≈ 220 yd', near(Math.round(201*YDPM), 220, 1));
    ok('toDisplayLength(220) yd-default = 220', toDisplayLength(220) === 220); // default pref is yd
  }catch(e){ ok('units block threw: '+e.message, false); }

  // --- Scrap weight->length: (grams/skeinG)*skeinYd ---
  try{
    const scrap = (g, sg, sy)=>Math.round((g/sg)*sy);
    ok('scrap 33g of 100g/220yd ≈ 73', scrap(33,100,220) === 73);
    ok('scrap 50g of 100g/210yd ≈ 105', scrap(50,100,210) === 105);
  }catch(e){ ok('scrap block threw: '+e.message, false); }

  // --- Gauge: sts per reference span, and cast-on ---
  try{
    const perRef = (sts, meas, unit)=>{ const per=sts/meas; const ref=unit==='cm'?10:4; return Math.round(per*ref*10)/10; };
    ok('gauge 18 sts/4in = 18 per 4in', perRef(18,4,'in') === 18);
    ok('gauge 9 sts/2in = 18 per 4in', perRef(9,2,'in') === 18);
    ok('gauge 22 sts/10cm = 22 per 10cm', perRef(22,10,'cm') === 22);
    ok('cast-on 4.5 sts/in × 20in = 90', countForSize(20, 18, 4) === 90);
    // The proportion from the Instagram slides: 14 sts & 12 rows per 10 cm.
    ok('slides: 25 cm wide at 14 sts/10cm = 35 sts', countForSize(25, 14, 10) === 35);
    ok('slides: 30 cm long at 12 rows/10cm = 36 rows', countForSize(30, 12, 10) === 36);
    ok('gaugeRate needs both inputs', gaugeRate(14, 0) === null && gaugeRate('', 10) === null);
    ok('countForSize no swatch = null', countForSize(25, '', 10) === null);
  }catch(e){ ok('gauge block threw: '+e.message, false); }

  // --- Gauge helpers: multiples, pattern conversion, even shaping ---
  try{
    const m = nearestMultiples(35, 6, 2);   // valid: 32, 38
    ok('multiple of 6+2 near 35 → 32 / 38', m.below===32 && m.above===38);
    const exact = nearestMultiples(38, 6, 2);
    ok('38 already fits 6+2', exact.below===38 && exact.above===38);
    ok('multiple of 2 (even) near 35 → 34 / 36', (()=>{ const e=nearestMultiples(35,2,0); return e.below===34 && e.above===36; })());
    ok('translate 80 sts @20/4in → @18/4in = 72', translateCount(80, 18/4, 20/4) === 72);
    const inc = spreadShaping(60, 10, 'inc');
    ok('60 sts +10 inc → 70, groups of 6', inc.result===70 && inc.groups.length===1 && inc.groups[0].size===6 && inc.groups[0].times===10);
    const inc2 = spreadShaping(64, 10, 'inc');   // 4×7 + 6×6 = 64
    ok('64 sts +10 inc → 4×7 + 6×6', inc2.groups[0].size===7 && inc2.groups[0].times===4 && inc2.groups[1].size===6 && inc2.groups[1].times===6);
    const dec = spreadShaping(60, 12, 'dec');
    ok('60 sts −12 dec → 48', dec.result===48 && dec.groups[0].size===5);
    ok('too many decreases → error', !!spreadShaping(10, 6, 'dec').error);
    ok('knit inc text', shapingRepeatText(6,'inc','knit') === 'K6, M1');
    ok('crochet dec text', shapingRepeatText(5,'dec','crochet','sc') === '3 sc, sc2tog');
    ok('US dc hint → UK tr', crochetTermHint('dc','us') === 'US dc = UK tr');
    ok('UK dc hint → US sc', crochetTermHint('dc','uk').startsWith('UK dc = US sc'));
  }catch(e){ ok('gauge helpers block threw: '+e.message, false); }

  // --- Scraps: migration + recording usage from a new skein or a scrap ---
  try{
    const base = { skeinYardage:220, skeinWeightGrams:100, quantity:3 };
    const legacy = normalizeLegacyYarn({ ...base, yardageRemaining:500 });     // 2 full + 60 yd partial
    ok('migration: 500 of 3×220 → one 60 yd scrap', legacy.scraps.length===1 && legacy.scraps[0].yards===60);
    ok('migration: whole skeins → no scraps', normalizeLegacyYarn({ ...base, yardageRemaining:660 }).scraps.length===0);
    ok('migration: isScrap flag → scrap', normalizeLegacyYarn({ ...base, quantity:1, isScrap:true, yardageRemaining:73 }).scraps[0].yards===73);
    ok('migration keeps existing scraps', normalizeLegacyYarn({ ...base, yardageRemaining:500, scraps:[] }).scraps.length===0);
    const y = { ...base, yardageRemaining:660, scraps:[] };
    const a = applyYarnUse(y, 50, 'new');
    ok('use 50 from new skein → 170 yd scrap', a.yardageRemaining===610 && a.scraps.length===1 && a.scraps[0].yards===170);
    ok('full skeins after → 2', fullSkeinCount(a)===2);
    const b = applyYarnUse(a, 30, a.scraps[0].id);
    ok('use 30 from that scrap → 140', b.scraps[0].yards===140 && b.yardageRemaining===580);
    const c = applyYarnUse(b, 140, b.scraps[0].id);
    ok('scrap used up disappears', c.scraps.length===0 && c.yardageRemaining===440);
    const d = applyYarnUse(y, 300, 'new');   // opens 2 skeins: 440 − 300 = 140 left
    ok('use 300 from new → 140 yd scrap', d.scraps[0].yards===140 && fullSkeinCount(d)===1);
    const e = applyYarnUse({ ...base, yardageRemaining:485, scraps:[{id:'s',yards:45}] }, 50, 's');
    ok('overflowing a scrap opens a new skein', e.yardageRemaining===435 && e.scraps.length===1 && e.scraps[0].yards===215);
    ok('grams ↔ yards', gramsToYards(base, 33)===73 && yardsToGrams(base, 73)===33);
  }catch(e){ ok('scraps block threw: '+e.message, false); }

  // --- Order import (rule-based, no AI) ---
  try{
    const brands = ['Malabrigo','Drops','Cascade Yarns','Lion Brand','Knit Picks'];
    const shopify = [
      'Thank you for shopping with Fiber Haus!', 'Order #1042', 'Order summary',
      'Malabrigo Rios × 2', 'Teal Feather', '$28.00',
      'Drops Safran - Powder Blue × 5', '$11.00',
      'Gift wrap', '$3.00',
      'Subtotal $42.00', 'Shipping $5.00', 'Total $47.00'
    ].join('\n');
    const r1 = parseOrderText(shopify, { brands });
    ok('shopify: finds 2 yarns (not gift wrap/totals)', r1.items.length===2);
    const rios = r1.items[0];
    ok('shopify: Rios ×2, colorway from variant line', rios.brand==='Malabrigo' && rios.line==='Rios' && rios.quantity===2 && rios.colorway==='Teal Feather');
    ok('shopify: line total ÷ qty = $14/skein', rios.cost===14);
    ok('shopify: preset fills weight & yardage', rios.weightCategory==='Worsted' && rios.skeinYardage===210);
    const safran = r1.items[1];
    ok('shopify: Safran ×5 Powder Blue $2.20', safran.line==='Safran' && safran.quantity===5 && safran.colorway==='Powder Blue' && safran.cost===2.2);
    ok('shopify: store from thank-you line', r1.store==='Fiber Haus');
    ok('color guessed from colorway', safran.colorHex && /^#/.test(safran.colorHex));

    const html = '<html><body><p>Order date: March 3, 2026</p><table>'
      + '<tr><th>Product</th><th>Quantity</th><th>Price</th></tr>'
      + '<tr><td>Cascade 220 Superwash - Navy (100g, 220 yds)</td><td>3</td><td>$29.97</td></tr>'
      + '<tr><td>Lion Brand Wool-Ease (Mustard)</td><td>1</td><td>$5.99</td></tr>'
      + '<tr><td>Bamboo needle set</td><td>1</td><td>$12.00</td></tr>'
      + '<tr><td>Subtotal</td><td></td><td>$47.96</td></tr></table></body></html>';
    const r2 = parseOrderText(htmlToText(html), { brands });
    const casc = r2.items.find(i=>i.brand==='Cascade Yarns');
    ok('html table: Cascade short brand, qty 3, $9.99', casc && casc.quantity===3 && casc.cost===9.99 && casc.colorway==='Navy');
    ok('html table: specs 100 g / 220 yd', casc && casc.skeinWeightGrams===100 && casc.skeinYardage===220);
    ok('html table: Wool-Ease Mustard', r2.items.some(i=>i.line==='Wool-Ease' && i.colorway==='Mustard'));
    ok('html table: order date parsed', r2.date==='2026-03-03');
    ok('html table: needle set left unticked', !r2.items.some(i=>/needle/i.test(i.line) && i.include));

    const eml = ['From: "Yarn Barn" <orders@yarnbarn.example>', 'Subject: =?UTF-8?Q?Your_order_=E2=9C=93?=',
      'Date: Tue, 6 Oct 2026 10:00:00 +0000', 'MIME-Version: 1.0',
      'Content-Type: multipart/alternative; boundary="b1"', '', '--b1',
      'Content-Type: text/html; charset=utf-8', 'Content-Transfer-Encoding: quoted-printable', '',
      '<table><tr><td>Knit Picks Wool of the Andes Worsted =E2=80=93 Cream</td><td>Qty: 4</td><td>$11=',
      '.96</td></tr></table>', '--b1--', ''].join('\r\n');
    const e = parseEml(eml);
    ok('eml: decodes from/subject', e.from.includes('Yarn Barn') && e.subject==='Your order ✓');
    const r3 = parseOrderText(e.text, { brands, from: e.from, date: e.date });
    const kp = r3.items[0];
    ok('eml: QP html → Knit Picks ×4 Cream $2.99', kp && kp.brand==='Knit Picks' && kp.quantity===4 && kp.colorway==='Cream' && kp.cost===2.99);
    ok('eml: store from sender, date from header', r3.store==='Yarn Barn' && r3.date==='2026-10-06');
    const uk = ['Your order has been received', 'Order number: 12345',
      'Paintbox Yarns Simply DK', 'Colour: Pistachio Green', 'Quantity: 6', 'Price: £2.99',
      'Scheepjes Catona 50g', 'Colour: 074 Mercury', 'Qty: 10', '£1.89 each',
      'Order total £36.84'].join('\n');
    const r4 = parseOrderText(uk, { brands });
    ok('uk: two unknown-brand yarns found', r4.items.length===2);
    const pb = r4.items[0], sc = r4.items[1];
    ok('uk: Paintbox Yarns / Simply DK guessed, DK weight', pb.brand==='Paintbox Yarns' && pb.line==='Simply DK' && pb.weightCategory==='DK');
    ok('uk: Colour/Quantity/Price lines → Pistachio Green ×6 £2.99', pb.colorway==='Pistachio Green' && pb.quantity===6 && pb.cost===2.99);
    ok('uk: "each" price is per skein (×10 @ £1.89)', sc.quantity===10 && sc.cost===1.89 && sc.colorway==='074 Mercury' && sc.skeinWeightGrams===50);
  }catch(e){ ok('order import block threw: '+e.message, false); }

  // --- Pattern PDF text → details (rule-based) ---
  try{
    const knit = parsePatternText([
      {text:'GARDENIA SHAWL', size:28, page:1},
      {text:'Designed by Jane Doe', size:12, page:1},
      {text:'Skill Level: Intermediate', size:10, page:1},
      {text:'Yarn: Malabrigo Rios (210 yds / 192 m per 100 g skein), 4 (5, 6) skeins of worsted weight', size:10, page:1},
      {text:'Needles: US 7 (4.5 mm) 32" circular needle; tapestry needle', size:10, page:1},
      {text:'Gauge: 18 sts and 24 rows = 4"/10 cm in St st', size:10, page:1},
      {text:'Row 1: K2, p2, k2tog, ssk, knit to end. Purl back.', size:10, page:2},
      {text:'© 2024 Jane Doe Designs. All rights reserved.', size:8, page:2}
    ]);
    ok('pdf: biggest page-1 text is the name (ALL CAPS → Title Case)', knit.name==='Gardenia Shawl');
    ok('pdf: "Designed by" → designer', knit.designer==='Jane Doe');
    ok('pdf: knit terms → knit', knit.craft==='knit');
    ok('pdf: gauge 18×24 per 4 in', knit.gauge && knit.gauge.sts===18 && knit.gauge.rows===24 && knit.gauge.unit==='in');
    ok('pdf: needle "4.5 mm / US 7"', knit.needleSize==='4.5 mm / US 7');
    ok('pdf: per-skein yds × largest skein count (210 × 6)', knit.yardage===1260);
    ok('pdf: worsted weight', knit.weightCategory==='Worsted');
    ok('pdf: skill level', knit.skillLevel==='Intermediate');

    const cro = parsePatternText(['Sunny Granny Blanket','Pattern by MARIA LOPEZ','Approximately 880 (960, 1,040) yards of DK weight yarn',
      'Hook: 4 mm (G-6) crochet hook','Gauge: 14 sc x 16 rows = 4 in','Rnd 1: ch 4, sl st to join. Ch 3, 2 dc, ch 2, 3 dc. Sc in next st, hdc.','Level: Easy']);
    ok('pdf: crochet terms → crochet', cro.craft==='crochet');
    ok('pdf: all-caps designer → Title Case', cro.designer==='Maria Lopez');
    ok('pdf: stated total yardage, largest size, "1,040" is one number', cro.yardage===1040);
    ok('pdf: hook "4 mm / G-6"', cro.needleSize==='4 mm / G-6');
    ok('pdf: DK + Easy', cro.weightCategory==='DK' && cro.skillLevel==='Easy');

    const uk = parsePatternText(['Hat','Tension: 22 sts and 30 rows to 10 cm over stocking stitch using 4mm needles',
      'You will need 2 x 50g balls of Rowan Felted Tweed DK (175 m / 50 g)']);
    ok('pdf: 10 cm gauge', uk.gauge && uk.gauge.sts===22 && uk.gauge.rows===30 && uk.gauge.unit==='cm');
    ok('pdf: metres per ball × "2 x 50g" → yards', uk.yardage===Math.round(175*YD_PER_M*2));
    const half = parsePatternText(['Gauge: 9 sts and 12 rows over 2"']);
    ok('pdf: gauge over 2" scaled to 4"', half.gauge && half.gauge.sts===18 && half.gauge.rows===24);
    const none = parsePatternText(['A lovely easy lace pattern for summer']);
    ok('pdf: prose "easy lace pattern" sets no skill or weight', none.skillLevel===null && none.weightCategory===null);
    ok('pdf: empty input → all null', Object.values(parsePatternText([])).every(v=>v===null));
  }catch(e){ ok('pattern pdf block threw: '+e.message, false); }

  // --- Pattern PDFs: sizes, versions, made-to-measure (made-up text in the
  //     layouts real garment patterns use) ---
  try{
    const sized = parsePatternText([
      {text:'WILLOW TOP', size:24.6, page:1},
      {text:'MATERIALS', size:16.7, page:1},
      {text:'XS – 10 oz (284 g) / 1,050 yd (960 m)', size:10.3, page:1},
      {text:'S – 11 oz (312 g) / 1,150 yd (1,052 m)', size:10.3, page:1},
      {text:'Hook: Size 4.00mm', size:10.3, page:1},
      {text:'M – 12.5 oz (354 g) / 1,300 yd (1,189 m)', size:10.3, page:1},
      {text:'2XL – 15 oz (425 g) / 1,560 yd (1,426 m)', size:10.3, page:1},
      {text:'your tension and any changes can affect how much you use', size:10.3, page:1},
      {text:'shell → 5 dc in the same st', size:10.3, page:1},
      {text:'(@fernhollowmakes on Instagram)', size:10.1, page:1},
      {text:'GAUGE', size:16.7, page:1},
      {text:'18 sts = 4 inc (10cm) in dc', size:10.3, page:1},
      {text:'8 rows = 4 inc (10cm) in dc', size:10.3, page:1}
    ]);
    ok('sizes: a line per size → 4 sizes, yards (not oz or metres)', sized.sizes && sized.sizes.length===4 && sized.sizes[0].label==='XS' && sized.sizes[0].yardage===1050 && sized.sizes[3].label==='2XL' && sized.sizes[3].yardage===1560);
    ok('sizes: no single yardage when sizes are found', sized.yardage===null);
    ok('gauge: "4 inc" is inches, prose "tension … 5 dc" ignored', sized.gauge && sized.gauge.sts===18 && sized.gauge.rows===8 && sized.gauge.unit==='in');
    ok('needle: size row "M – 12.5 oz" is not a hook letter', sized.needleSize==='4 mm');
    ok('designer: "@handle on Instagram"', sized.designer==='@fernhollowmakes');

    const versions = parsePatternText(['This pattern is owned by BrambleStitch. Please do not share it.',
      'I used 3 skeins (400 yards) of cotton yarn for the cropped length,', 'and 5 skeins (650 yards) for the full length',
      'You can make it longer or shorter as you go']);
    ok('versions: "400 yards … for the cropped length, 650 yards for the full length"', versions.sizes && versions.sizes.length===2 && versions.sizes[0].label==='Cropped length' && versions.sizes[0].yardage===400 && versions.sizes[1].label==='Full length' && versions.sizes[1].yardage===650);
    ok('designer: "owned by X." stops at the sentence end', versions.designer==='BrambleStitch');

    const measured = parsePatternText(['Cardigan designed by @mossandmarrow',
      'I used approx. 250 g of linen yarn (100 g/300 m, fingering weight).',
      'It is held together with a lace weight mohair (25g/200m),', 'of which I used approx. 75g (3 skeins).',
      'Crochet hook', '3 mm larger than the size on your yarn label (mine said 2-2,5 mm)']);
    ok('made to measure: grams used × length per weight, both yarns (≈1,350 m)', measured.yardage===Math.round(750*YD_PER_M + 75*(200/25)*YD_PER_M));
    ok('needle: "3 mm larger than" and "2-2,5 mm" are advice, not the hook', measured.needleSize===null);
    ok('designer: "designed by @handle"', measured.designer==='@mossandmarrow');

    const listed = parsePatternText(['Sizes: XS (S, M, L) [XL, 2XL]', 'MC: 600 (650, 700, 760) [820, 880] yds', 'CC: 100 (110, 120, 130) [140, 150] yds']);
    ok('sizes: size list + matching yardage lists, MC + CC added per size', listed.sizes && listed.sizes.length===6 && listed.sizes[0].yardage===700 && listed.sizes[5].label==='2XL' && listed.sizes[5].yardage===1030);
    const swatch = parsePatternText(['Gauge swatch', 'My example:', '6 STS = 3 cm wide.', '4 ROWS = 2.5 cm tall.']);
    ok('gauge: stitches and rows each use their own measurement', swatch.gauge && swatch.gauge.sts===20 && swatch.gauge.rows===16 && swatch.gauge.unit==='cm');

    const sz = [{label:'XS',yardage:1126},{label:'S',yardage:1227},{label:'M',yardage:1381},{label:'L',yardage:1483}];
    ok('covered: 1,400 yd → XS–M', patternSizesCovered(sz, 1400)==='XS–M');
    ok('covered: 1,130 yd → XS only', patternSizesCovered(sz, 1130)==='XS');
    ok('covered: too little → null', patternSizesCovered(sz, 900)===null);

    const pat = { name:'Top', designer:'Me', sizes:[], yardage:null, gauge:null, needleSize:'5 mm' };
    const merged = mergePdfFindings(pat, { sizes: sz, yardage: 999, designer:'Someone', needleSize:'4 mm', gauge:{sts:16,rows:7,unit:'in'} });
    ok('refresh: fills empty sizes and gauge', merged.changed && merged.sizes.length===4 && merged.gauge.sts===16);
    ok('refresh: never overwrites what is set (designer, needle), no single yardage beside sizes', merged.designer==='Me' && merged.needleSize==='5 mm' && merged.yardage===null);
    ok('refresh: nothing new → unchanged', mergePdfFindings({ ...pat, sizes: sz }, { sizes: sz }).changed===false);
  }catch(e){ ok('garment pdf block threw: '+e.message, false); }

  // --- Pattern cover choice ---
  try{
    const files = [{ url:'a.pdf', type:'application/pdf', previews:['p1.jpg','p2.jpg'] }, { url:'b.jpg', type:'image/jpeg' }, { url:'c.pdf', type:'application/pdf' }];
    ok('cover: defaults to the first preview', resolvePatternCover(files, null)==='p1.jpg');
    ok('cover: chosen image is kept', resolvePatternCover(files, 'b.jpg')==='b.jpg');
    ok('cover: chosen image gone → first available', resolvePatternCover(files.slice(1), 'p2.jpg')==='b.jpg');
    ok('cover: "none" turns it off', resolvePatternCover(files, 'none')===null);
    ok('cover: no previewable files → null', resolvePatternCover([files[2]], null)===null);
    ok('cover: older PDF with only thumbUrl still counts', resolvePatternCover([{ url:'d.pdf', thumbUrl:'t.jpg' }], null)==='t.jpg');
  }catch(e){ ok('cover block threw: '+e.message, false); }

  // --- Bulk add: grouping files into patterns by name ---
  try{
    ok('bulk key: role words, camel case, versions dropped', patternFileKey('TheHarbourJumperColourUpdate.pdf')==='harbour jumper' && patternFileKey('The_Harbour_Jumper_Chart.pdf')==='harbour jumper');
    ok('bulk key: glued version suffix and double extension', patternFileKey('Fernaddonsv11.pdf.pdf')==='fernaddons' && patternFileKey('TidesBikiniBottomsV11.pdf')==='tides bikini bottoms');
    ok('bulk key: lookbook and crochet pattern match', patternFileKey('Bramble_rose_cardigan_lookbook.pdf')===patternFileKey('Bramble_rose_cardigan_crochet_pattern.pdf'));
    ok('bulk keys: shorter name starts the longer', patternKeysMatch('juniper', 'juniper full set') && !patternKeysMatch('tides bikini bottoms', 'tides skirt'));
    const files = ['Juniper_full_set_crochet_pattern.pdf','Juniper_lookbook.pdf','wild_thyme_lookbook_1.pdf','Wild_thyme_cardigan_crochet_pattern.pdf',
      'ABC_SnowDoodle_Infinity.pdf','ABC_SnowDoodle_Exp1_Charts.pdf','ABC_RainDoodle_Infinity.pdf','Acorn_Applique_Pattern_Link.pdf','Acorn_Applique_PDF_Pattern_Fast.pdf',
      'TidesBikiniBottomsV11.pdf','Thetidesskirtv12.pdf','WillowTop.pdf'].map((name,i) => ({ name, size: 1000+i, foundName: null }));
    const lib = [{ id:'L', name:'Willow Top', files:[{ name:'WillowTop.pdf', size: 1011 }] }, { id:'M', name:'Meadow Sweater', files:[] }];
    const r = groupPatternFiles(files, lib);
    const groupOf = n => r.groups.find(g => g.items.some(i => files[i].name === n));
    ok('bulk group: pattern + lookbook together, pattern first', groupOf('Juniper_lookbook.pdf') === groupOf('Juniper_full_set_crochet_pattern.pdf') && files[groupOf('Juniper_lookbook.pdf').items[0]].name.startsWith('Juniper_full'));
    ok('bulk group: lookbook listed first still ends up second', files[groupOf('wild_thyme_lookbook_1.pdf').items[0]].name.startsWith('Wild_thyme_cardigan'));
    ok('bulk group: charts expansion joins its cowl, other cowl stays apart', groupOf('ABC_SnowDoodle_Exp1_Charts.pdf') === groupOf('ABC_SnowDoodle_Infinity.pdf') && groupOf('ABC_RainDoodle_Infinity.pdf') !== groupOf('ABC_SnowDoodle_Infinity.pdf'));
    ok('bulk group: link sheet joins its pattern', groupOf('Acorn_Applique_Pattern_Link.pdf') === groupOf('Acorn_Applique_PDF_Pattern_Fast.pdf'));
    ok('bulk group: two Tides patterns stay apart', groupOf('TidesBikiniBottomsV11.pdf') !== groupOf('Thetidesskirtv12.pdf'));
    ok('bulk group: same name + size already in library → skipped', r.duplicates.length===1 && files[r.duplicates[0]].name==='WillowTop.pdf');
    const r2 = groupPatternFiles([{ name:'TheMeadowSweaterCrochetPattern.pdf', size:5 }], lib);
    ok('bulk group: matches an existing pattern by name', r2.groups[0].existingId === 'M');
    ok('bulk name: PDF title used when it fits the file', bulkPatternName('Aurora_top_pattern.pdf', 'Aurora top')==='Aurora top');
    ok('bulk name: junk title falls back to the file name', bulkPatternName('Marigold_top_lookbook.pdf', 'By: @someone_makes (designer) Size: small/medium.')==='Marigold top' && bulkPatternName('Acorn_Applique_Pattern_Link.pdf', 'Hello!')==='Acorn Applique Link');
    ok('bulk name: generic file name uses the PDF title', bulkPatternName('pattern.pdf', 'Fern Shawl')==='Fern Shawl' && bulkPatternName('Crochet Pattern.pdf', 'SEA GLASS TEE - printable')==='Sea Glass Tee');
    ok('bulk name: nothing to go on → Untitled pattern', bulkPatternName('pattern.pdf', null)==='Untitled pattern');
    ok('bulk name: shouting title tidied', bulkPatternName('Acorn_Applique_PDF_Pattern_Fast.pdf', 'ACORN APPLIQUE PDF PATTERN - do not sell or copy')==='Acorn Applique');
    const m = mergeFoundDetails([{ name:'A', designer:null, craft:'crochet', yardage:684, needleSize:'4 mm' }, { designer:'@x', craft:'knit', yardage:415, needleSize:'8 mm', weightCategory:'DK' }]);
    ok('bulk details: first file wins, later files fill gaps', m.yardage===684 && m.needleSize==='4 mm' && m.designer==='@x' && m.weightCategory==='DK' && m.craft==='crochet');
  }catch(e){ ok('bulk add block threw: '+e.message, false); }
  // --- PDF preview images: skip backgrounds, rank logos last ---
  try{
    const px = (n, f) => { const a = new Uint8ClampedArray(n*4); for(let i=0;i<n;i++){ const [r,g,b,al] = f(i); a.set([r,g,b,al], i*4); } return a; };
    const paper = previewPixelStats(px(400, i => { const v = 215 + (i%7); return [v,v-4,v-10,255]; }));
    const photo = previewPixelStats(px(400, i => { const v = (i*37)%256; return [v, (v*3)%256, 255-v, 255]; }));
    const logo = previewPixelStats(px(400, i => i%10===0 ? [20,20,20,255] : [255,255,255,255]));
    const clear = previewPixelStats(px(400, () => [0,0,0,0]));
    ok('preview stats: paper texture has almost no contrast', paper.std < PREVIEW_MIN_CONTRAST);
    ok('preview stats: photo has contrast and little white', photo.std > 40 && photo.white < 0.2);
    ok('preview stats: logo is mostly white', logo.white >= 0.89);
    ok('preview stats: transparent counts as white', clear.white === 1 && clear.std === 0);
    const r = rankPreviewCandidates([{ id:'paper', score:0.9, ...paper }, { id:'logo', score:0.5, ...logo }, { id:'photo', score:0.4, ...photo }]);
    ok('preview rank: background dropped, photo beats a bigger logo', r.map(c=>c.id).join()==='photo,logo');
    const notebook = previewPixelStats(px(400, i => i%20===0 ? [120,120,125,255] : [232,230,225,255]));
    const chart = previewPixelStats(px(400, i => i%3===0 ? [90,90,90,255] : [255,255,255,255]));
    ok('preview stats: pale colourless page counts as background', notebook.std >= PREVIEW_MIN_CONTRAST && isBackgroundImage(notebook));
    ok('preview stats: photo is not background, has colour', !isBackgroundImage(photo) && photo.sat > 40);
    const r2 = rankPreviewCandidates([{ id:'chart', score:0.86, ...chart }, { id:'photo', score:0.19, ...photo }]);
    ok('preview rank: grey stitch chart ranks below a smaller colour photo', r2[0].id==='photo');
  }catch(e){ ok('preview block threw: '+e.message, false); }
  // --- Restore from backup ---
  try{
    ok('backup: not a Woolgather file', !parseBackup({ app:'Other', yarns:[] }).ok && !parseBackup([1,2]).ok && !parseBackup(null).ok);
    ok('backup: damaged list rejected', !parseBackup({ app:'Woolgather', yarns:'oops' }).ok);
    const pb = parseBackup({ app:'Woolgather', exportedAt:'2026-10-01T00:00:00Z', yarns:[{id:'y1'},{id:'y2'}], patterns:[{id:'p1'}] });
    ok('backup: missing lists become empty', pb.ok && pb.data.projects.length===0 && pb.data.yarns.length===2 && pb.exportedAt);
    const cur = { yarns:[{id:'y1', name:'mine'}], projects:[], palettes:[], shoppingList:[{ note:'buy' }], patterns:[] };
    const bk = { yarns:[{id:'y1', name:'old'},{id:'y2'}], projects:[{id:'pr'}], palettes:[], shoppingList:[{ note:'buy' },{ note:'other' }], patterns:[{id:'p1'}] };
    const mg = mergeBackup(cur, bk, 'merge');
    ok('backup merge: adds missing ids, keeps your version of the rest', mg.data.yarns.length===2 && mg.data.yarns[0].name==='mine' && mg.added.yarns===1 && mg.added.projects===1 && mg.added.patterns===1);
    ok('backup merge: id-less items deduped by content', mg.data.shoppingList.length===2 && mg.added.shoppingList===1);
    const rp = mergeBackup(cur, bk, 'replace');
    ok('backup replace: takes the backup as is', rp.data.yarns.length===2 && rp.data.yarns[0].name==='old' && rp.data.shoppingList.length===2);
  }catch(e){ ok('backup block threw: '+e.message, false); }

  // --- Yarn → patterns, pattern → shopping ---
  try{
    const pats = [
      { id:'a', name:'Tee', status:'saved', weightCategory:'DK', sizes:[{label:'S',yardage:800},{label:'M',yardage:950},{label:'L',yardage:1100}] },
      { id:'b', name:'Cowl', status:'queued', weightCategory:'DK', yardage:300 },
      { id:'c', name:'Hat', status:'saved', weightCategory:'Worsted', yardage:200 },
      { id:'d', name:'Blanket', status:'saved', weightCategory:'DK', yardage:3000 },
      { id:'e', name:'Mystery', status:'saved', weightCategory:'DK' }
    ];
    const fits = patternsForYarn({ weightCategory:'DK', yardageRemaining: 1000 }, pats);
    ok('yarn → patterns: same weight with enough length, queued first', fits.map(m=>m.pattern.id).join()==='b,a');
    ok('yarn → patterns: which sizes it covers', fits[1].covers==='S–M' && !fits[1].all && fits[0].all);
    ok('yarn → patterns: no length left → none', patternsForYarn({ weightCategory:'DK', yardageRemaining: 0 }, pats).length===0);
    const yarns = [{ id:'y1', yardageRemaining: 700 }, { id:'y2', yardageRemaining: 900 }];
    const opts = patternShoppingOptions(1100, yarns);
    ok('shopping: top up the yarn you have most of, or buy all new', opts.length===2 && opts[0].kind==='topup' && opts[0].yarn.id==='y2' && opts[0].yards===200 && opts[1].kind==='new' && opts[1].yards===1100);
    ok('shopping: enough already → nothing to buy', patternShoppingOptions(800, yarns).length===0);
    ok('shopping: no yarn of that weight → buy new only', patternShoppingOptions(500, []).map(o=>o.kind).join()==='new');
  }catch(e){ ok('yarn/pattern shopping block threw: '+e.message, false); }

  // --- Tabs talking to each other ---
  try{
    ok('pattern status: WIP project queues a saved pattern', patternStatusForProject('saved','WIP')==='queued');
    ok('pattern status: finished project → made', patternStatusForProject('queued','Finished')==='made');
    ok('pattern status: never goes backwards, frogged changes nothing', patternStatusForProject('made','Planned')==='made' && patternStatusForProject('saved','Frogged')==='saved');
    ok('finish date: set when finishing, kept if already set', withStatusDates({ status:'Finished' }).finishDate===todayStr() && withStatusDates({ status:'Finished', finishDate:'2026-01-02' }).finishDate==='2026-01-02' && !withStatusDates({ status:'WIP' }).finishDate);
    const g = compareGauge({ sts:18, rows:24, unit:'in' }, { sts:18, rows:28, unit:'in' });
    ok('gauge vs pattern: same stitches on gauge, fewer rows looser', g.sts==='on' && g.rows==='loose');
    const gc = compareGauge({ sts:22, rows:null, unit:'cm' }, { sts:20, rows:28, unit:'in' });
    ok('gauge vs pattern: 4 in vs 10 cm converted; more sts = tighter', gc.sts==='tight' && gc.rows===null);
    const pats = [{ id:'q1', name:'Beret', status:'queued', weightCategory:'DK', yardage:200 }, { id:'q2', name:'Vest', status:'queued', weightCategory:'DK', sizes:[{label:'S',yardage:900},{label:'M',yardage:1000}] },
      { id:'q3', name:'Socks', status:'queued', weightCategory:'Fingering', yardage:400 }, { id:'q4', name:'Started', status:'queued', weightCategory:'DK', yardage:100 }, { id:'s1', name:'Saved one', status:'saved', weightCategory:'DK', yardage:10 }];
    const yarns = [{ id:'a', weightCategory:'DK', yardageRemaining:950, status:'available' }, { id:'b', weightCategory:'DK', yardageRemaining:5000, status:'allocated' }];
    const up = upNextPatterns(pats, yarns, [{ patternId:'q4', status:'WIP' }]);
    ok('up next: queued only, minus ones already started', up.map(m=>m.pattern.id).sort().join()==='q1,q2,q3');
    ok('up next: ready ones first, with sizes covered', up[0].ready && up[1].ready && up.find(m=>m.pattern.id==='q2').covers==='S');
    ok('up next: allocated yarn not counted; none of that weight → not ready', up.find(m=>m.pattern.id==='q3').ready===false && up.find(m=>m.pattern.id==='q3').yarn===null);
  }catch(e){ ok('connected tabs block threw: '+e.message, false); }

  // --- Ravelry → Woolgather fields ---
  try{
    ok('ravelry weight names', ravelryWeight('DK (8 ply, 11 wpi)')==='DK' && ravelryWeight('Aran')==='Worsted' && ravelryWeight('Light Fingering')==='Fingering' && ravelryWeight('Super Bulky (5-6 ply)')==='Super Bulky' && ravelryWeight('Cobweb')==='Lace' && ravelryWeight('Any gauge - designed for any gauge')===null);
    ok('ravelry difficulty → skill', ravelrySkill(1.8)==='Beginner' && ravelrySkill(4.2)==='Easy' && ravelrySkill(6)==='Intermediate' && ravelrySkill(8)==='Experienced' && ravelrySkill(0)===null);
    const f = ravelryPatternFields({ name:'Sample Tee', permalink:'sample-tee', designer:'D', craft:'knitting', yardage:820, yardageMax:1450, weight:'DK (8 ply, 11 wpi)',
      sizes:'XS (S, M)', gauge:11, rowGauge:15, gaugeDivisor:2, needles:[{ name:'US 6 - 4.0 mm' }, { name:'US 4 - 3.5 mm' }], difficulty:4.2, photos:['a.jpg','b.jpg'] });
    ok('ravelry pattern: gauge per 2 in scaled to 4 in', f.gauge.sts===22 && f.gauge.rows===30 && f.gauge.unit==='in');
    ok('ravelry pattern: largest yardage used, range kept', f.yardage===1450 && f.yardageRange[0]===820 && f.yardageRange[1]===1450);
    ok('ravelry pattern: craft, weight, needles, link, photos', f.craft==='knit' && f.weightCategory==='DK' && f.needleSize==='US 6 - 4.0 mm, US 4 - 3.5 mm' && f.sourceUrl==='https://www.ravelry.com/patterns/library/sample-tee' && f.photos.length===2);
    ok('ravelry pattern: no gauge or divisor → no gauge', ravelryPatternFields({ name:'X', gauge:20, gaugeDivisor:null }).gauge===null);
    const y = ravelryYarnFields({ company:'Demo Co', name:'Merino DK', weight:'DK', yardage:231, grams:100, fibers:[{ pct:80, name:'Merino' }, { pct:20, name:'Nylon' }] });
    ok('ravelry yarn: brand, line, weight, skein, fiber', y.brand==='Demo Co' && y.line==='Merino DK' && y.weightCategory==='DK' && y.skeinYardage===231 && y.skeinWeightGrams===100 && y.fiber==='80% Merino, 20% Nylon');
    ok('ravelry link → permalink', ravelryLink('https://www.ravelry.com/patterns/library/sample-tee?utm=x')==='sample-tee' && ravelryLink('https://example.com/p')===null);
    ok('cover: photo URLs from elsewhere count as options', resolvePatternCover([], null, ['r.jpg'])==='r.jpg' && resolvePatternCover([{ url:'b.jpg', type:'image/jpeg' }], 'r.jpg', ['r.jpg'])==='r.jpg');
  }catch(e){ ok('ravelry block threw: '+e.message, false); }

  // --- closenessPercent monotonic ---
  try{
    ok('closeness identical = 100', closenessPercent(0) === 100);
    ok('closeness worse < better', closenessPercent(30) < closenessPercent(5));
  }catch(e){ ok('closeness block threw: '+e.message, false); }

  const sum = document.getElementById('summary');
  sum.textContent = `${passed} passed, ${failed} failed`;
  sum.className = failed === 0 ? 'ok' : 'bad';
})();
</script>
</body>
</html>
