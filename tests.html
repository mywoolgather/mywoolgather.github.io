<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Woolgather — logic tests</title>
<style>
  body{ font-family: ui-monospace, Menlo, Consolas, monospace; max-width:760px; margin:24px auto; padding:0 16px; color:#2A2333; }
  h1{ font-family: Georgia, serif; }
  .pass{ color:#3E6B49; }
  .fail{ color:#7A2F4B; font-weight:700; }
  .row{ padding:3px 0; border-bottom:1px solid #eee; }
  #summary{ font-size:1.1rem; font-weight:700; margin:16px 0; padding:12px; border-radius:8px; }
  #summary.ok{ background:#e3efe3; color:#3E6B49; }
  #summary.bad{ background:#f6e2e8; color:#7A2F4B; }
</style>
</head>
<body>
<h1>Woolgather logic tests</h1>
<p>Runs the app's pure functions (color science, gauge, units, scrap, weight) against known values. No framework — just open this file. It stubs browser globals so app.js can load without booting the UI.</p>
<div id="summary">Running…</div>
<div id="results"></div>

<!-- Stub the browser globals app.js touches at load, BEFORE loading it, so
     importing the file defines its functions without starting the real app. -->
<script>
  window.STATE = { unitPref:'yd', yarns:[], projects:[] };
  window.FB = null;                       // app guards on this; no auto-init
  // no-op DOM bits app.js may call at module top-level
  window.matchMedia = window.matchMedia || function(){ return { matches:false, addEventListener(){}, addListener(){} }; };
</script>
<script src="app.js"></script>

<script>
(function(){
  const results = document.getElementById('results');
  let passed = 0, failed = 0;

  function ok(name, cond){
    const div = document.createElement('div');
    div.className = 'row ' + (cond ? 'pass' : 'fail');
    div.textContent = (cond ? '✓ ' : '✗ FAIL — ') + name;
    results.appendChild(div);
    cond ? passed++ : failed++;
  }
  // approximate-equality for floats
  const near = (a,b,tol=0.5)=>Math.abs(a-b)<=tol;

  // --- Color science ---
  try{
    ok('deltaE2000 identical = 0', deltaE2000(hexToLab('#5C3A72'), hexToLab('#5C3A72')) === 0);
    ok('deltaE2000 black vs white ≈ 100', near(deltaE2000(hexToLab('#000'), hexToLab('#fff')), 100, 1));
    // Sharma et al. CIEDE2000 reference pair ≈ 2.0425
    ok('CIEDE2000 Sharma reference ≈ 2.04', near(deltaE2000({L:50,a:2.6772,b:-79.7751},{L:50,a:0,b:-82.7485}), 2.0425, 0.02));
    ok('nameColor sage', nameColor('#8FAF7C') === 'Sage green');
    ok('nameColor plum', nameColor('#5C3A72') === 'Plum');
    ok('nameColor navy', nameColor('#2a3a63') === 'Navy');
    ok('hslToHex red', hslToHex(0,100,50).toLowerCase() === '#ff0000');
  }catch(e){ ok('color science block threw: '+e.message, false); }

  // --- Neutrals ---
  try{
    ok('neutral: grey', isNeutralYarn({colorHex:'#9098a1'}) === true);
    ok('neutral: cream', isNeutralYarn({colorHex:'#efe7d3'}) === true);
    ok('neutral: brown', isNeutralYarn({colorHex:'#6f4e37'}) === true);
    ok('NOT neutral: sage', isNeutralYarn({colorHex:'#8faf7c'}) === false);
    ok('NOT neutral: moss (muted green)', isNeutralYarn({colorHex:'#6f7d5a'}) === false);
    ok('NOT neutral: rust', isNeutralYarn({colorHex:'#a8432a'}) === false);
  }catch(e){ ok('neutrals block threw: '+e.message, false); }

  // --- Weight adjacency (Aran merged into Worsted) ---
  try{
    ok('weight DK<->Worsted adjacent', weightCompatible('DK','Worsted') === true);
    ok('weight DK<->Bulky NOT adjacent', weightCompatible('DK','Bulky') === false);
    ok('weight Worsted<->Bulky adjacent', weightCompatible('Worsted','Bulky') === true);
  }catch(e){ ok('weight block threw: '+e.message, false); }

  // --- Units (yd canonical). STATE is module-scoped inside app.js and not
  //     reachable here, so we test the conversion CONSTANT/math directly
  //     rather than flipping the preference through the STATE wrappers. ---
  try{
    const YDPM = 1.0936133;
    ok('220 yd ≈ 201 m', near(Math.round(220/YDPM), 201, 1));
    ok('201 m ≈ 220 yd', near(Math.round(201*YDPM), 220, 1));
    ok('toDisplayLength(220) yd-default = 220', toDisplayLength(220) === 220); // default pref is yd
  }catch(e){ ok('units block threw: '+e.message, false); }

  // --- Scrap weight->length: (grams/skeinG)*skeinYd ---
  try{
    const scrap = (g, sg, sy)=>Math.round((g/sg)*sy);
    ok('scrap 33g of 100g/220yd ≈ 73', scrap(33,100,220) === 73);
    ok('scrap 50g of 100g/210yd ≈ 105', scrap(50,100,210) === 105);
  }catch(e){ ok('scrap block threw: '+e.message, false); }

  // --- Gauge: sts per reference span, and cast-on ---
  try{
    const perRef = (sts, meas, unit)=>{ const per=sts/meas; const ref=unit==='cm'?10:4; return Math.round(per*ref*10)/10; };
    ok('gauge 18 sts/4in = 18 per 4in', perRef(18,4,'in') === 18);
    ok('gauge 9 sts/2in = 18 per 4in', perRef(9,2,'in') === 18);
    ok('gauge 22 sts/10cm = 22 per 10cm', perRef(22,10,'cm') === 22);
    ok('cast-on 4.5 sts/in × 20in = 90', countForSize(20, 18, 4) === 90);
    // The proportion from the Instagram slides: 14 sts & 12 rows per 10 cm.
    ok('slides: 25 cm wide at 14 sts/10cm = 35 sts', countForSize(25, 14, 10) === 35);
    ok('slides: 30 cm long at 12 rows/10cm = 36 rows', countForSize(30, 12, 10) === 36);
    ok('gaugeRate needs both inputs', gaugeRate(14, 0) === null && gaugeRate('', 10) === null);
    ok('countForSize no swatch = null', countForSize(25, '', 10) === null);
  }catch(e){ ok('gauge block threw: '+e.message, false); }

  // --- Gauge helpers: multiples, pattern conversion, even shaping ---
  try{
    const m = nearestMultiples(35, 6, 2);   // valid: 32, 38
    ok('multiple of 6+2 near 35 → 32 / 38', m.below===32 && m.above===38);
    const exact = nearestMultiples(38, 6, 2);
    ok('38 already fits 6+2', exact.below===38 && exact.above===38);
    ok('multiple of 2 (even) near 35 → 34 / 36', (()=>{ const e=nearestMultiples(35,2,0); return e.below===34 && e.above===36; })());
    ok('translate 80 sts @20/4in → @18/4in = 72', translateCount(80, 18/4, 20/4) === 72);
    const inc = spreadShaping(60, 10, 'inc');
    ok('60 sts +10 inc → 70, groups of 6', inc.result===70 && inc.groups.length===1 && inc.groups[0].size===6 && inc.groups[0].times===10);
    const inc2 = spreadShaping(64, 10, 'inc');   // 4×7 + 6×6 = 64
    ok('64 sts +10 inc → 4×7 + 6×6', inc2.groups[0].size===7 && inc2.groups[0].times===4 && inc2.groups[1].size===6 && inc2.groups[1].times===6);
    const dec = spreadShaping(60, 12, 'dec');
    ok('60 sts −12 dec → 48', dec.result===48 && dec.groups[0].size===5);
    ok('too many decreases → error', !!spreadShaping(10, 6, 'dec').error);
    ok('knit inc text', shapingRepeatText(6,'inc','knit') === 'K6, M1');
    ok('crochet dec text', shapingRepeatText(5,'dec','crochet','sc') === '3 sc, sc2tog');
    ok('US dc hint → UK tr', crochetTermHint('dc','us') === 'US dc = UK tr');
    ok('UK dc hint → US sc', crochetTermHint('dc','uk').startsWith('UK dc = US sc'));
  }catch(e){ ok('gauge helpers block threw: '+e.message, false); }

  // --- closenessPercent monotonic ---
  try{
    ok('closeness identical = 100', closenessPercent(0) === 100);
    ok('closeness worse < better', closenessPercent(30) < closenessPercent(5));
  }catch(e){ ok('closeness block threw: '+e.message, false); }

  const sum = document.getElementById('summary');
  sum.textContent = `${passed} passed, ${failed} failed`;
  sum.className = failed === 0 ? 'ok' : 'bad';
})();
</script>
</body>
</html>
